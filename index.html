<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pueblo Cero — prototipo</title>
<style>
  :root { --centro: #e8d9a0; --papel: #f2ece0 }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent }
  html, body { height: 100%; overflow: hidden; background: #0d0f10 }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--papel); touch-action: none; overscroll-behavior: none;
  }
  canvas { display: block }

  #estado {
    position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0;
    padding: 12px 18px; display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(0,0,0,.85); pointer-events: none;
  }
  #plata { opacity: .7 }

  #aviso {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom, 0));
    background: rgba(15,13,10,.9); border: 1px solid rgba(242,236,224,.25);
    padding: 10px 16px; border-radius: 4px;
    font-size: 12px; letter-spacing: .03em; line-height: 1.5;
    opacity: 0; transition: opacity .18s ease; text-align: center; max-width: 60vw;
  }
  #aviso.visible { opacity: 1 }
  #aviso b { color: var(--centro); font-weight: 600 }

  #base, #puno { position: fixed; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .15s ease }
  #base { width: 112px; height: 112px; border: 2px solid rgba(242,236,224,.28) }
  #puno { width: 48px; height: 48px; background: rgba(242,236,224,.82) }
  #base.on, #puno.on { opacity: 1 }

  #portada {
    position: fixed; inset: 0; z-index: 10; background: #10131a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; text-align: center; padding: 24px;
  }
  #portada h1 { font-size: clamp(30px, 7vw, 52px); font-weight: 700; letter-spacing: .16em; text-transform: uppercase }
  #portada p { font-size: 13px; opacity: .6; line-height: 1.8; letter-spacing: .04em }
  #jugar {
    font: inherit; font-size: 15px; letter-spacing: .12em; text-transform: uppercase;
    padding: 16px 44px; border: 1px solid var(--centro);
    background: transparent; color: var(--centro); border-radius: 3px; cursor: pointer;
  }
  #jugar:active { background: var(--centro); color: #10131a }
  #portada.oculta { display: none }

  #girar {
    position: fixed; inset: 0; z-index: 9; background: #10131a; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px;
    font-size: 14px; letter-spacing: .06em; line-height: 1.7;
  }
  @media (orientation: portrait) and (max-width: 900px) {
    body.jugando #girar { display: flex }
  }
</style>
</head>
<body>

<div id="estado"><span id="lugar">Pueblo Cero</span><span id="plata">$0</span></div>
<div id="aviso"></div>
<div id="base"></div>
<div id="puno"></div>

<div id="girar">
  <div style="font-size:40px">&#10227;</div>
  <div>Girá el teléfono<br>para jugar en horizontal</div>
</div>

<div id="portada">
  <h1>Pueblo Cero</h1>
  <p>Izquierda: caminar<br>Derecha: mirar alrededor</p>
  <button id="jugar">Entrar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   PUEBLO CERO — prototipo

   Vegetación y terreno.

   El objetivo era acercarse a un árbol de verdad —tronco que se afina, copa
   frondosa, tonos mezclados— sin descargar modelos ni texturas. Cada árbol se
   genera con dos formas: un tronco cónico y un racimo de bultos irregulares
   como copa. Con suficientes bultos y algo de azar en el tamaño, el color y
   la posición, deja de parecer geometría y empieza a parecer follaje.

   El costo de eso son muchísimos objetos, y ahí está el truco que hace que
   corra en un teléfono: en vez de un objeto por bulto, se usa un `InstancedMesh`
   por tono de verde. Sesenta árboles con doce bultos cada uno son ~720 piezas,
   pero la tarjeta gráfica sólo recibe una orden por tono. Sin eso, el teléfono
   se arrastraría.
   ═══════════════════════════════════════════════════════════════════════════ */

const escena = new THREE.Scene();
escena.fog = new THREE.Fog(0x8fa8bd, 55, 150);

const camara = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 420);

const render = new THREE.WebGLRenderer({ antialias: true });
render.setSize(innerWidth, innerHeight);
render.setPixelRatio(Math.min(devicePixelRatio, 2));
render.shadowMap.enabled = true;
render.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(render.domElement);

/* ── Azar repetible ───────────────────────────────────────────────────────
   Con Math.random() el bosque cambiaría en cada carga y sería imposible decir
   "ese árbol de allá quedó mal". Con semilla, el mundo es siempre el mismo. */
let semilla = 20260821;
function azar() {
  semilla = (semilla * 1103515245 + 12345) & 0x7fffffff;
  return semilla / 0x7fffffff;
}
function entre(a, b) { return a + azar() * (b - a); }

/* ── Relieve ──────────────────────────────────────────────────────────────
   Ondulado suave con sumas de senos. Dentro del pueblo el terreno es plano:
   si el Centro y los lotes quedaran sobre lomas, los edificios flotarían o se
   enterrarían, y arreglarlo cuesta más de lo que aporta. */
const RADIO_PUEBLO = 36;

const LAGUNAS = [
  { x: -58, z: 22, r: 17 },
  { x: 48, z: -52, r: 14 }
];
const NIVEL_AGUA = -1.15;

function alturaEn(x, z) {
  const d = Math.hypot(x, z);
  if (d < RADIO_PUEBLO) return 0;

  let h = Math.sin(x * 0.045) * 1.5 + Math.cos(z * 0.038) * 1.7
        + Math.sin((x + z) * 0.021) * 2.4;

  // Las lagunas son hoyos: el terreno baja hacia el centro de cada una y el
  // agua es un plano fijo. Así la orilla aparece sola donde el terreno cruza
  // el nivel del agua, en vez de tener que dibujarla.
  for (let i = 0; i < LAGUNAS.length; i++) {
    const l = LAGUNAS[i];
    const dl = Math.hypot(x - l.x, z - l.z);
    if (dl < l.r) {
      const t = 1 - dl / l.r;
      h -= (t * t) * 5.5;
    }
  }

  // Transición suave desde el pueblo plano hacia el relieve.
  const mezcla = Math.min((d - RADIO_PUEBLO) / 14, 1);
  return h * mezcla * mezcla;
}

/* ── Cielo ─────────────────────────────────────────────────────────────── */
const cielo = new THREE.Mesh(
  new THREE.SphereGeometry(200, 24, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      arriba: { value: new THREE.Color(0x3f76ae) },
      abajo:  { value: new THREE.Color(0xbdd2e2) }
    },
    vertexShader:
      'varying float h;' +
      'void main(){ h = normalize(position).y;' +
      'gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader:
      'uniform vec3 arriba; uniform vec3 abajo; varying float h;' +
      'void main(){ gl_FragColor = vec4(mix(abajo, arriba, clamp(h*1.4,0.0,1.0)),1.0); }'
  })
);
escena.add(cielo);

for (let i = 0; i < 20; i++) {
  const a = azar() * Math.PI * 2, r = 70 + azar() * 90;
  const nube = new THREE.Group();
  const n = 3 + Math.floor(azar() * 3);
  for (let j = 0; j < n; j++) {
    const c = new THREE.Mesh(
      new THREE.BoxGeometry(9 + azar() * 12, 3.5, 7 + azar() * 8),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 })
    );
    c.position.set((azar() - 0.5) * 16, (azar() - 0.5) * 2, (azar() - 0.5) * 12);
    nube.add(c);
  }
  nube.position.set(Math.cos(a) * r, 46 + azar() * 26, Math.sin(a) * r);
  escena.add(nube);
}

/* ── Luz ───────────────────────────────────────────────────────────────── */
escena.add(new THREE.HemisphereLight(0xa8c4dc, 0x3d4a2a, 0.72));
const sol = new THREE.DirectionalLight(0xfff4dd, 1.0);
sol.position.set(-34, 44, 22);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
sol.shadow.camera.left = -70; sol.shadow.camera.right = 70;
sol.shadow.camera.top = 70; sol.shadow.camera.bottom = -70;
sol.shadow.bias = -0.0009;
escena.add(sol);

/* ── Suelo ────────────────────────────────────────────────────────────────
   Un plano subdividido, desplazado por el relieve y pintado vértice por
   vértice. El color por vértice es lo que saca al pasto de ser una alfombra
   verde: manchones más oscuros, tierra en las orillas de las lagunas y en los
   caminos del pueblo. */
const LADO = 240, DIV = 150;
const geoSuelo = new THREE.PlaneGeometry(LADO, LADO, DIV, DIV);
geoSuelo.rotateX(-Math.PI / 2);

const pos = geoSuelo.attributes.position;
const colores = new Float32Array(pos.count * 3);

const PASTO_OSCURO = new THREE.Color(0x2f4420);
const PASTO_MEDIO  = new THREE.Color(0x466b28);
const PASTO_CLARO  = new THREE.Color(0x5f8434);
const TIERRA       = new THREE.Color(0x6b5334);
const ARENA        = new THREE.Color(0x8c7a52);

const c = new THREE.Color();
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const y = alturaEn(x, z);
  pos.setY(i, y);

  // Manchones: dos ondas de distinta frecuencia mezclan los tres verdes.
  const mancha = (Math.sin(x * 0.19) * Math.cos(z * 0.23) + Math.sin((x + z) * 0.08)) * 0.5 + 0.5;
  c.copy(PASTO_OSCURO).lerp(PASTO_MEDIO, Math.min(mancha * 1.4, 1));
  if (mancha > 0.72) c.lerp(PASTO_CLARO, (mancha - 0.72) * 2.6);

  // Orilla: donde el terreno se acerca al nivel del agua, arena.
  if (y < NIVEL_AGUA + 1.3) {
    c.lerp(ARENA, Math.min((NIVEL_AGUA + 1.3 - y) / 1.6, 0.85));
  }

  // Tierra pisada alrededor del Centro.
  const d = Math.hypot(x, z);
  if (d < 15.5) c.lerp(TIERRA, 0.9);
  else if (d < 18) c.lerp(TIERRA, (18 - d) / 2.5 * 0.9);

  colores[i * 3] = c.r; colores[i * 3 + 1] = c.g; colores[i * 3 + 2] = c.b;
}
geoSuelo.setAttribute('color', new THREE.BufferAttribute(colores, 3));
geoSuelo.computeVertexNormals();

const suelo = new THREE.Mesh(
  geoSuelo,
  new THREE.MeshLambertMaterial({ vertexColors: true })
);
suelo.receiveShadow = true;
escena.add(suelo);

/* ── Agua ─────────────────────────────────────────────────────────────────
   Un disco translúcido por laguna, que sube y baja apenas. No es una
   simulación: es lo justo para que el ojo lea "esto está vivo" y no "acá hay
   un vidrio azul". */
const aguas = [];
for (let i = 0; i < LAGUNAS.length; i++) {
  const l = LAGUNAS[i];
  const agua = new THREE.Mesh(
    new THREE.CircleGeometry(l.r + 1.5, 40),
    new THREE.MeshLambertMaterial({
      color: 0x2d6b7a, transparent: true, opacity: 0.82,
      emissive: 0x0a2630
    })
  );
  agua.rotation.x = -Math.PI / 2;
  agua.position.set(l.x, NIVEL_AGUA, l.z);
  escena.add(agua);
  aguas.push(agua);
}

/* ── Edificios ─────────────────────────────────────────────────────────── */
function caja(ancho, alto, largo, color, x, y, z) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(ancho, alto, largo),
    new THREE.MeshLambertMaterial({ color: color })
  );
  m.position.set(x, y + alto / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  escena.add(m);
  return m;
}

caja(11, 5.5, 11, 0xe8d9a0, 0, 0, 0);
caja(12.5, 0.7, 12.5, 0xb4543c, 0, 5.5, 0);
caja(2.4, 3.4, 0.4, 0x4a3a26, 0, 0, 5.6);
[-3.4, 3.4].forEach(function (x) { caja(1.6, 1.6, 0.3, 0x8fb8c9, x, 2.4, 5.6); });
caja(0.35, 9, 0.35, 0xd8cdb4, 0, 6.2, -4.2);
caja(2.6, 1.5, 0.15, 0xb4543c, 1.4, 13.4, -4.2);

const LOTES = [];
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const x = Math.cos(a) * 27, z = Math.sin(a) * 27;

  const piso = new THREE.Mesh(
    new THREE.PlaneGeometry(11, 11),
    new THREE.MeshLambertMaterial({ color: 0x6f5a3c })
  );
  piso.rotation.x = -Math.PI / 2;
  piso.position.set(x, 0.04, z);
  piso.receiveShadow = true;
  escena.add(piso);

  const esq = [[-5, -5], [5, -5], [-5, 5], [5, 5]];
  for (let e = 0; e < esq.length; e++) caja(0.3, 1.3, 0.3, 0x4a3a26, x + esq[e][0], 0, z + esq[e][1]);
  LOTES.push({ x: x, z: z, nombre: 'Lote ' + (i + 1) });

  const camino = new THREE.Mesh(
    new THREE.PlaneGeometry(2.4, 14),
    new THREE.MeshLambertMaterial({ color: 0x7d6a4a })
  );
  camino.rotation.x = -Math.PI / 2;
  camino.rotation.z = -a;
  camino.position.set(Math.cos(a) * 20, 0.03, Math.sin(a) * 20);
  camino.receiveShadow = true;
  escena.add(camino);
}

/* ═══════════════════════════════════════════════════════════════════════════
   ÁRBOLES

   Dos especies y seis tonos de verde, mezclados. Cada árbol elige un tono
   base y cada bulto de su copa se desvía un poco de ese tono: así ningún
   árbol es de un solo color plano, que es lo que delata a la geometría.
   ═══════════════════════════════════════════════════════════════════════════ */

const VERDES = [
  0x1e3d16,  // muy oscuro, casi pino
  0x2c5220,  // oscuro
  0x3d6b26,  // medio
  0x548c2f,  // claro
  0x77a33a,  // amarillento
  0x94b444   // amarillo verdoso
];

const geoBulto = new THREE.IcosahedronGeometry(1, 0);
const geoTronco = new THREE.CylinderGeometry(0.42, 0.72, 1, 7);
const geoPino = new THREE.ConeGeometry(1, 1, 8);

// Se recolecta todo primero y se crea la geometría después: hay que saber
// cuántas piezas de cada tono hay antes de reservar el espacio.
const bultosPorTono = [];
for (let i = 0; i < VERDES.length; i++) bultosPorTono.push([]);
const troncos = [];

function prohibido(x, z) {
  const d = Math.hypot(x, z);
  if (d < 34) return true;                        // pueblo y lotes
  for (let i = 0; i < LAGUNAS.length; i++) {
    const l = LAGUNAS[i];
    if (Math.hypot(x - l.x, z - l.z) < l.r + 3) return true;   // dentro del agua
  }
  return false;
}

function arbolFrondoso(x, z, y, escala) {
  const alto = entre(5.5, 9) * escala;
  const grosor = entre(0.5, 0.8) * escala;
  troncos.push({ x: x, y: y, z: z, alto: alto, grosor: grosor, color: 0x4a3524 });

  const tono = Math.floor(entre(1, VERDES.length));
  const radioCopa = entre(2.2, 3.4) * escala;
  const centroCopa = y + alto * 0.86;
  const cuantos = 9 + Math.floor(azar() * 5);

  for (let i = 0; i < cuantos; i++) {
    // Distribución achatada: más ancha que alta, como una copa real.
    const ang = azar() * Math.PI * 2;
    const rr = Math.pow(azar(), 0.6) * radioCopa;
    const bx = x + Math.cos(ang) * rr;
    const bz = z + Math.sin(ang) * rr;
    const by = centroCopa + (azar() - 0.35) * radioCopa * 0.85;
    const r = entre(0.85, 1.5) * escala * (1 - rr / (radioCopa * 2.4));

    // Cada bulto se corre un tono respecto del árbol: eso es lo que evita el
    // verde plano y hace que se lea como hojas y no como una pelota.
    let t = tono + (azar() < 0.5 ? -1 : 1) * (azar() < 0.45 ? 1 : 0);
    t = Math.max(0, Math.min(VERDES.length - 1, t));
    bultosPorTono[t].push({ x: bx, y: by, z: bz, r: Math.max(r, 0.5) });
  }
}

function pino(x, z, y, escala) {
  const alto = entre(7, 12) * escala;
  troncos.push({ x: x, y: y, z: z, alto: alto * 0.42, grosor: entre(0.34, 0.5) * escala, color: 0x3d2b1c });

  const tono = Math.floor(entre(0, 3));   // los pinos van en los verdes oscuros
  const capas = 4 + Math.floor(azar() * 3);
  for (let i = 0; i < capas; i++) {
    const t = i / capas;
    const r = (1 - t) * entre(2.0, 2.8) * escala + 0.55;
    const h = alto * 0.30;
    const cy = y + alto * 0.32 + t * alto * 0.62;
    const tt = Math.max(0, Math.min(VERDES.length - 1, tono + (azar() < 0.3 ? 1 : 0)));
    bultosPorTono[tt].push({ x: x, y: cy + h / 2, z: z, r: r, cono: true, alto: h });
  }
}

let plantados = 0, intentos = 0;
while (plantados < 130 && intentos < 3000) {
  intentos++;
  const a = azar() * Math.PI * 2;
  const r = 34 + Math.pow(azar(), 0.7) * 78;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (prohibido(x, z)) continue;

  const y = alturaEn(x, z);
  if (y < NIVEL_AGUA + 0.4) continue;      // no plantar dentro del agua

  // Alturas mezcladas: la mayoría medianos, algunos muy grandes y varios
  // chicos. Un bosque donde todos los árboles miden lo mismo se ve fabricado.
  const dado = azar();
  const escala = dado < 0.18 ? entre(0.45, 0.7)
               : dado < 0.82 ? entre(0.8, 1.15)
                             : entre(1.3, 1.75);

  if (azar() < 0.34) pino(x, z, y, escala);
  else arbolFrondoso(x, z, y, escala);
  plantados++;
}

/* ── Volcar a InstancedMesh ───────────────────────────────────────────────
   Acá está la diferencia entre que corra a 60 cuadros o a 8: en vez de un
   objeto por bulto, una sola orden de dibujo por tono. */
const aux = new THREE.Object3D();

for (let t = 0; t < VERDES.length; t++) {
  const lista = bultosPorTono[t];
  if (!lista.length) continue;

  const esferas = lista.filter(function (b) { return !b.cono; });
  const conos = lista.filter(function (b) { return b.cono; });

  if (esferas.length) {
    const im = new THREE.InstancedMesh(
      geoBulto, new THREE.MeshLambertMaterial({ color: VERDES[t], flatShading: true }), esferas.length
    );
    im.castShadow = true; im.receiveShadow = true;
    for (let i = 0; i < esferas.length; i++) {
      const b = esferas[i];
      aux.position.set(b.x, b.y, b.z);
      // Achatado y girado al azar: dos bultos con el mismo tamaño y la misma
      // orientación se notan como copias enseguida.
      aux.scale.set(b.r * entre(0.95, 1.25), b.r * entre(0.7, 0.95), b.r * entre(0.95, 1.25));
      aux.rotation.set(azar() * 3, azar() * 3, azar() * 3);
      aux.updateMatrix();
      im.setMatrixAt(i, aux.matrix);
    }
    escena.add(im);
  }

  if (conos.length) {
    const im = new THREE.InstancedMesh(
      geoPino, new THREE.MeshLambertMaterial({ color: VERDES[t], flatShading: true }), conos.length
    );
    im.castShadow = true; im.receiveShadow = true;
    for (let i = 0; i < conos.length; i++) {
      const b = conos[i];
      aux.position.set(b.x, b.y, b.z);
      aux.scale.set(b.r, b.alto, b.r);
      aux.rotation.set(0, azar() * 3, 0);
      aux.updateMatrix();
      im.setMatrixAt(i, aux.matrix);
    }
    escena.add(im);
  }
}

const imTronco = new THREE.InstancedMesh(
  geoTronco, new THREE.MeshLambertMaterial({ color: 0x4a3524, flatShading: true }), troncos.length
);
imTronco.castShadow = true; imTronco.receiveShadow = true;
for (let i = 0; i < troncos.length; i++) {
  const t = troncos[i];
  aux.position.set(t.x, t.y + t.alto / 2, t.z);
  aux.scale.set(t.grosor, t.alto, t.grosor);
  // Inclinación mínima: ningún árbol crece perfectamente a plomo.
  aux.rotation.set(entre(-0.05, 0.05), azar() * 3, entre(-0.05, 0.05));
  aux.updateMatrix();
  imTronco.setMatrixAt(i, aux.matrix);
}
escena.add(imTronco);

/* ── Arbustos y piedras, para llenar el piso ───────────────────────────── */
const matArbusto = new THREE.MeshLambertMaterial({ color: 0x35561f, flatShading: true });
const imArbusto = new THREE.InstancedMesh(geoBulto, matArbusto, 150);
imArbusto.castShadow = true; imArbusto.receiveShadow = true;
let na = 0;
while (na < 150) {
  const a = azar() * Math.PI * 2, r = 30 + azar() * 85;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (Math.hypot(x, z) < 32) continue;
  const y = alturaEn(x, z);
  if (y < NIVEL_AGUA + 0.3) continue;
  aux.position.set(x, y + 0.35, z);
  aux.scale.set(entre(0.5, 1.1), entre(0.35, 0.6), entre(0.5, 1.1));
  aux.rotation.set(0, azar() * 3, 0);
  aux.updateMatrix();
  imArbusto.setMatrixAt(na, aux.matrix);
  na++;
}
escena.add(imArbusto);

/* ── El muñeco ─────────────────────────────────────────────────────────── */
const jugador = new THREE.Group();
escena.add(jugador);

function parte(ancho, alto, largo, color, x, y, z) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(ancho, alto, largo),
    new THREE.MeshLambertMaterial({ color: color })
  );
  m.position.set(x, y, z);
  m.castShadow = true;
  jugador.add(m);
  return m;
}

parte(1.1, 1.4, 0.6, 0x2f6ea8, 0, 1.5, 0);
const cabeza    = parte(0.85, 0.85, 0.85, 0xd9a678, 0, 2.6, 0);
const brazoIzq  = parte(0.34, 1.2, 0.34, 0xd9a678, -0.72, 1.6, 0);
const brazoDer  = parte(0.34, 1.2, 0.34, 0xd9a678, 0.72, 1.6, 0);
const piernaIzq = parte(0.42, 1.2, 0.42, 0x39424f, -0.3, 0.4, 0);
const piernaDer = parte(0.42, 1.2, 0.42, 0x39424f, 0.3, 0.4, 0);
jugador.position.set(0, 0, 16);

/* ── Cámara libre ──────────────────────────────────────────────────────── */
let yaw = Math.PI, pitch = 0.22;
const DISTANCIA = 9.5;
const PITCH_MIN = -1.35, PITCH_MAX = 1.35;

const base = document.getElementById('base');
const puno = document.getElementById('puno');

let dedoMover = null, origenX = 0, origenY = 0, ejeX = 0, ejeY = 0;
let dedoMirar = null, ultimoX = 0, ultimoY = 0;
const RADIO = 50, SENSIBILIDAD = 0.0055;

function esZonaDeMover(x) { return x < innerWidth * 0.5; }

addEventListener('touchstart', function (e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (esZonaDeMover(t.clientX) && dedoMover === null) {
      dedoMover = t.identifier;
      origenX = t.clientX; origenY = t.clientY;
      base.style.left = (origenX - 56) + 'px'; base.style.top = (origenY - 56) + 'px';
      puno.style.left = (origenX - 24) + 'px'; puno.style.top = (origenY - 24) + 'px';
      base.classList.add('on'); puno.classList.add('on');
    } else if (!esZonaDeMover(t.clientX) && dedoMirar === null) {
      dedoMirar = t.identifier; ultimoX = t.clientX; ultimoY = t.clientY;
    }
  }
}, { passive: true });

addEventListener('touchmove', function (e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === dedoMover) {
      let dx = t.clientX - origenX, dy = t.clientY - origenY;
      const d = Math.hypot(dx, dy);
      if (d > RADIO) { dx = dx / d * RADIO; dy = dy / d * RADIO; }
      ejeX = dx / RADIO; ejeY = dy / RADIO;
      puno.style.left = (origenX + dx - 24) + 'px';
      puno.style.top = (origenY + dy - 24) + 'px';
    } else if (t.identifier === dedoMirar) {
      yaw -= (t.clientX - ultimoX) * SENSIBILIDAD;
      pitch += (t.clientY - ultimoY) * SENSIBILIDAD;
      pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch));
      ultimoX = t.clientX; ultimoY = t.clientY;
    }
  }
}, { passive: true });

function soltar(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier === dedoMover) {
      dedoMover = null; ejeX = 0; ejeY = 0;
      base.classList.remove('on'); puno.classList.remove('on');
    }
    if (t.identifier === dedoMirar) dedoMirar = null;
  }
}
addEventListener('touchend', soltar, { passive: true });
addEventListener('touchcancel', soltar, { passive: true });

const teclas = {};
addEventListener('keydown', function (e) { teclas[e.key.toLowerCase()] = true; });
addEventListener('keyup', function (e) { teclas[e.key.toLowerCase()] = false; });

let arrastrando = false, ratonX = 0, ratonY = 0;
render.domElement.addEventListener('mousedown', function (e) {
  arrastrando = true; ratonX = e.clientX; ratonY = e.clientY;
});
addEventListener('mouseup', function () { arrastrando = false; });
addEventListener('mousemove', function (e) {
  if (!arrastrando) return;
  yaw -= (e.clientX - ratonX) * SENSIBILIDAD;
  pitch += (e.clientY - ratonY) * SENSIBILIDAD;
  pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch));
  ratonX = e.clientX; ratonY = e.clientY;
});

/* ── Bucle ─────────────────────────────────────────────────────────────── */
const VELOCIDAD = 7.5, LIMITE = 105;
let paso = 0, rumbo = Math.PI;
let relojAnterior = performance.now();

const aviso = document.getElementById('aviso');
const lugar = document.getElementById('lugar');
let avisoActual = '';

function mostrarAviso(texto) {
  if (texto === avisoActual) return;
  avisoActual = texto;
  if (texto) { aviso.innerHTML = texto; aviso.classList.add('visible'); }
  else aviso.classList.remove('visible');
}

const posCamara = new THREE.Vector3();

function bucle(ahora) {
  requestAnimationFrame(bucle);
  const dt = Math.min((ahora - relojAnterior) / 1000, 0.05);
  relojAnterior = ahora;

  let adelante = -ejeY, costado = ejeX;
  if (teclas['w'] || teclas['arrowup']) adelante += 1;
  if (teclas['s'] || teclas['arrowdown']) adelante -= 1;
  if (teclas['a'] || teclas['arrowleft']) costado -= 1;
  if (teclas['d'] || teclas['arrowright']) costado += 1;

  const fuerza = Math.min(Math.hypot(adelante, costado), 1);

  if (fuerza > 0.06) {
    const frenteX = -Math.sin(yaw), frenteZ = -Math.cos(yaw);
    const derX = -frenteZ, derZ = frenteX;

    let dx = frenteX * adelante + derX * costado;
    let dz = frenteZ * adelante + derZ * costado;
    const largo = Math.hypot(dx, dz) || 1;
    dx /= largo; dz /= largo;

    jugador.position.x += dx * VELOCIDAD * fuerza * dt;
    jugador.position.z += dz * VELOCIDAD * fuerza * dt;

    const objetivo = Math.atan2(dx, dz);
    let giro = objetivo - rumbo;
    while (giro > Math.PI) giro -= Math.PI * 2;
    while (giro < -Math.PI) giro += Math.PI * 2;
    rumbo += giro * Math.min(dt * 11, 1);
    jugador.rotation.y = rumbo;

    paso += dt * 11 * fuerza;
    const balanceo = Math.sin(paso) * 0.55 * fuerza;
    brazoIzq.rotation.x = balanceo;
    brazoDer.rotation.x = -balanceo;
    piernaIzq.rotation.x = -balanceo;
    piernaDer.rotation.x = balanceo;
    cabeza.position.y = 2.6 + Math.abs(Math.sin(paso)) * 0.045;
  } else {
    brazoIzq.rotation.x *= 0.85; brazoDer.rotation.x *= 0.85;
    piernaIzq.rotation.x *= 0.85; piernaDer.rotation.x *= 0.85;
  }

  jugador.position.x = Math.max(-LIMITE, Math.min(LIMITE, jugador.position.x));
  jugador.position.z = Math.max(-LIMITE, Math.min(LIMITE, jugador.position.z));

  // Seguir el relieve. Suavizado: sin esto, cada ondulación se sentiría como
  // un escalón y el muñeco daría saltitos.
  const sueloAqui = Math.max(alturaEn(jugador.position.x, jugador.position.z), NIVEL_AGUA - 0.35);
  jugador.position.y += (sueloAqui - jugador.position.y) * Math.min(dt * 9, 1);

  const cosP = Math.cos(pitch);
  posCamara.set(
    jugador.position.x + Math.sin(yaw) * cosP * DISTANCIA,
    jugador.position.y + 2.4 + Math.sin(pitch) * DISTANCIA,
    jugador.position.z + Math.cos(yaw) * cosP * DISTANCIA
  );
  const pisoCamara = alturaEn(posCamara.x, posCamara.z) + 1.0;
  if (posCamara.y < pisoCamara) posCamara.y = pisoCamara;

  camara.position.lerp(posCamara, Math.min(dt * 14, 1));
  camara.lookAt(jugador.position.x, jugador.position.y + 2.2, jugador.position.z);
  cielo.position.copy(camara.position);

  // El agua respira. Un movimiento mínimo alcanza.
  const t = ahora * 0.0011;
  for (let i = 0; i < aguas.length; i++) {
    aguas[i].position.y = NIVEL_AGUA + Math.sin(t + i * 2) * 0.06;
  }

  const dCentro = Math.hypot(jugador.position.x, jugador.position.z);
  if (dCentro < 15) {
    lugar.textContent = 'El Centro · zona segura';
    mostrarAviso(dCentro < 9
      ? 'Comida y ropa <b>gratis</b>, siempre.<br>Acá nadie te puede robar.' : '');
  } else {
    let cerca = null;
    for (let i = 0; i < LOTES.length; i++) {
      const l = LOTES[i];
      if (Math.hypot(jugador.position.x - l.x, jugador.position.z - l.z) < 7) { cerca = l; break; }
    }
    if (cerca) {
      lugar.textContent = cerca.nombre + ' · vacío';
      mostrarAviso('Terreno libre.<br>Acá se podrá <b>construir un negocio</b>.');
    } else {
      let enLaguna = false;
      for (let i = 0; i < LAGUNAS.length; i++) {
        const l = LAGUNAS[i];
        if (Math.hypot(jugador.position.x - l.x, jugador.position.z - l.z) < l.r + 2) { enLaguna = true; break; }
      }
      lugar.textContent = enLaguna ? 'La laguna' : 'Pueblo Cero';
      mostrarAviso('');
    }
  }

  render.render(escena, camara);
}
requestAnimationFrame(bucle);

/* ── Entrar ────────────────────────────────────────────────────────────── */
document.getElementById('jugar').addEventListener('click', function () {
  document.getElementById('portada').classList.add('oculta');
  document.body.classList.add('jugando');

  const raiz = document.documentElement;
  const pedir = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
  if (pedir) {
    try { const p = pedir.call(raiz); if (p && p.catch) p.catch(function () {}); } catch (_) {}
  }
  if (screen.orientation && screen.orientation.lock) {
    try { const p = screen.orientation.lock('landscape'); if (p && p.catch) p.catch(function () {}); } catch (_) {}
  }
  setTimeout(ajustar, 200);
});

function ajustar() {
  camara.aspect = innerWidth / innerHeight;
  camara.updateProjectionMatrix();
  render.setSize(innerWidth, innerHeight);
}
addEventListener('resize', ajustar);
addEventListener('orientationchange', function () { setTimeout(ajustar, 250); });
</script>
</body>
